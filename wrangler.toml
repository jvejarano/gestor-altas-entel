name = "gestor-altas-entel"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "gestor-altas"
# Reemplazar con el id que devuelve: npx wrangler d1 create gestor-altas
database_id = "REEMPLAZAR_CON_TU_DATABASE_ID"
migrations_dir = "migrations"
